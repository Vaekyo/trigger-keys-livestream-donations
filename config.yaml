# =====================================================================
#  Donation Controls: daftar aksi + pengaturan keamanan
#  File ini otomatis dimuat ulang saat disimpan (tidak perlu restart),
#  KECUALI kill_switch_key dan port (perlu restart).
#  Kalau ada salah ketik, error muncul di console dan config lama tetap dipakai.
# =====================================================================

safety:
  kill_switch_key: F12          # hotkey global ON/PAUSE. Kalau tidak jalan, ganti F10 / PAUSE / CTRL+SHIFT+P
  start_paused: true            # mulai dalam keadaan PAUSED; nyalakan manual (F12 / panel)
  gap_between_actions_s: 0.5    # jeda kecil antar aksi di antrian (bukan cooldown; 0 = langsung)
  max_actions_per_minute: 60    # batas pengaman per 60 detik (60 = praktis tanpa batas)
  max_hold_s: 10                # batas lama 1 langkah hold / spam / jitter / wait
  max_action_s: 20              # batas total 1 aksi; lewat -> semua tombol dilepas
  max_queue_age_s: 180          # donasi yang menunggu lebih dari ini (paused / tidak fokus) dilewati
  require_focus: true           # hanya kirim input saat jendela Valorant yang aktif
  focus_process: VALORANT-Win64-Shipping.exe
  when_unfocused: wait          # wait = tunggu sampai Valorant fokus lagi, skip = langsung lewati
  dry_run: false                # true = tidak kirim input sama sekali (cuma log + overlay)
  tap_ms: 40                    # lama 1 kali "tap" tombol

server:
  panel_port: 8787              # panel, overlay, price list (JANGAN di-tunnel)
  webhook_port: 8788            # khusus webhook Tako/Trakteer (ini yang di-tunnel)
  allow_lan: true               # true = panel bisa dibuka dari HP/MacBook di WiFi yang sama (pakai token)

overlay:
  template: "{donor} donated Rp{amount} → {action}!"
  duration_s: 6
  default_sound: null           # contoh: /sounds/alert.mp3 (taruh file di folder sounds/)

# ---------------------------------------------------------------------
#  AKSI. Tier kelipatan Rp2.000. Dipilih tier TERTINGGI yang min_amount <= nominal.
#  Tidak ada cooldown: semua donasi masuk ANTRIAN dan dijalankan satu per satu.
#  Keybind = default Valorant. Ganti kalau bind kamu beda.
#
#  Jenis step:
#    - tap: SPACE                       tekan sekali (bisa list: [3, 1])
#    - random_tap: [C, Q, E]            tekan salah satu secara acak
#    - click: LEFT                      klik mouse (LEFT / RIGHT), untuk konfirmasi skill
#    - hold: {key: SHIFT, ms: 10000}    tahan tombol
#    - spam: {key: CTRL, ms: 3000, every: 150}   tekan berulang
#    - wait: 200                        tunggu (ms)
#    - mouse: {dx: 12857, dy: 0, ms: 600}        gerak mouse relatif
#    - jitter: {ms: 5000, strength: 40, every: 25}  goyang acak, balik ke posisi awal
#  Tombol: A-Z, 0-9, SPACE, CTRL, SHIFT, ALT, TAB, ESC, ENTER, F1-F12, UP/DOWN/LEFT/RIGHT, dll.
#
#  KALAU KLIK MOUSE GAGAL (error 87): di Valorant, Settings > Controls > Combat > Fire,
#  isi tombol KEDUA (mis. K). Lalu di bawah ganti "- click: LEFT" jadi "- tap: K".
# ---------------------------------------------------------------------
actions:
  - name: Jump
    min_amount: 2000
    enabled: true
    overlay_text: "LOMPAT!"
    sound: null
    steps:
      - tap: SPACE

  - name: Crouch spam
    min_amount: 4000
    enabled: true
    overlay_text: "Crouch spam 3 detik"
    sound: null
    steps:
      - spam: {key: CTRL, ms: 3000, every: 150}

  - name: Random skill
    min_amount: 6000
    enabled: true
    overlay_text: "Pakai skill random"
    sound: null
    steps:
      - random_tap: [C, Q, E]   # pilih skill
      - wait: 250               # tunggu skill siap
      - click: LEFT             # pakai skill

  - name: Drop weapon
    min_amount: 8000
    enabled: true
    overlay_text: "Buang senjata!"
    sound: null
    steps:
      - tap: G

  - name: Spin 360
    min_amount: 10000
    enabled: true
    overlay_text: "Muter 360°"
    sound: null
    steps:
      # dx untuk 1 putaran = 360 / (sensitivity Valorant x 0.07)
      #   sens 0.40 -> 12857 | sens 0.30 -> 17143 | sens 0.50 -> 10286
      - mouse: {dx: 12857, dy: 0, ms: 600}

  - name: Ultimate
    min_amount: 12000
    enabled: true
    overlay_text: "ULTIMATE (kalau ready)"
    sound: null
    steps:
      - tap: X
      - wait: 400
      - click: LEFT

  - name: Drunk aim
    min_amount: 14000
    enabled: true
    overlay_text: "Mabok aim 5 detik"
    sound: null
    steps:
      - jitter: {ms: 5000, strength: 40, every: 25}
